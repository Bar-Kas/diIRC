services:
  ircd:
    image: ergochat/ergo:latest
    container_name: irc-server
    ports:
      - "6667:6667"  # Plain IRC port (non-SSL)
    volumes:
      - ./data:/ircd-data
    restart: unless-stopped

  pomf:
    build: ./pomf
    container_name: pomf-server
    ports:
      - "9999:9999"
    environment:
      - PORT=9999
      - DOMAIN=http://localhost:9999
    volumes:
      - ./data/pomf-uploads:/app/uploads
    restart: unless-stopped